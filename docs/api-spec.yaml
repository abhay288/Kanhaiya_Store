openapi: 3.0.3
info:
  title: Kanhaiya General Store E-Commerce API
  description: Production REST API specification for Kanhaiya General Store customer & administrative back-office.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://kanhaiya-store-api.onrender.com/api/v1
    description: Production environment

paths:
  /health:
    get:
      summary: API health and uptime check
      description: Returns service status, MongoDB connection health, uptime, and server timestamp.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/google:
    post:
      summary: Google Firebase OAuth exchange
      description: Verifies Firebase ID token, resolves or provisions customer user, returns JWT & user profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  description: Firebase ID Token from client
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired Firebase ID token

  /auth/me:
    get:
      summary: Retrieve current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
        '401':
          description: Unauthorized - Valid token required

  /auth/logout:
    post:
      summary: Terminate session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /admin/test:
    get:
      summary: Verify administrator authorization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authorization confirmed
        '403':
          description: Forbidden - Administrator privilege required

  /categories:
    get:
      summary: Fetch active categories
      responses:
        '200':
          description: List of store categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /products:
    get:
      summary: Search and browse products
      parameters:
        - name: categoryId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /products/{id}:
    get:
      summary: Retrieve single product details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

  /orders:
    get:
      summary: List authenticated customer orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User order history
    post:
      summary: Place a new order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed successfully
        '400':
          description: Insufficient stock or invalid item pricing

  /orders/{id}/invoice:
    get:
      summary: Download PDF invoice for completed order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF invoice stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /admin/orders:
    get:
      summary: Admin order management list
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All customer orders with filterable state
        '403':
          description: Forbidden - Admin credentials required

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: string, example: "ok" }
        timestamp: { type: string, format: date-time }
        uptime: { type: number, example: 124.5 }
        database: { type: string, example: "connected" }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            displayName: { type: string }
            role: { type: string, enum: [CUSTOMER, ADMIN] }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: string }
        displayOrder: { type: integer }

    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        categoryId: { type: string }
        unit: { type: string, example: "1 kg" }
        mrp: { type: number, example: 120.00 }
        sellingPrice: { type: number, example: 98.00 }
        stockQuantity: { type: integer, example: 45 }
        isAvailable: { type: boolean, example: true }
        images:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              isPrimary: { type: boolean }

    ProductListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    CreateOrderRequest:
      type: object
      required:
        - items
        - shippingAddress
        - paymentMethod
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              quantity: { type: integer, minimum: 1 }
        shippingAddress:
          type: object
          required: [recipientName, phone, streetAddress, city, state, pincode]
          properties:
            recipientName: { type: string }
            phone: { type: string }
            streetAddress: { type: string }
            city: { type: string }
            state: { type: string }
            pincode: { type: string }
        paymentMethod:
          type: string
          enum: [cod, whatsapp_qr]
        paymentReference:
          type: string
