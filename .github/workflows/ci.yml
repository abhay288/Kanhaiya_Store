name: Kanhaiya Store CI / Automated Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  backend-qa:
    name: Backend API Typecheck & Automated Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Backend Vitest Suite (10 Test Suites / 132 Tests)
        run: npm test

  pwa-qa:
    name: React PWA Compilation & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/customer_pwa
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/customer_pwa/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Production Build (Vite & Workbox SW Generation)
        run: npm run build

  flutter-qa:
    name: Flutter Android Static Analysis & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/customer_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run Flutter Test Suite (26 Tests)
        run: flutter test
