# Render Blueprint for standalone backend deployment
version: "1"

services:
  - type: web
    name: kanhaiya-store-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateWithLength: 32
      - key: ADMIN_ALLOWED_EMAILS
        value: kanhaiyaastore@gmail.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STORE_NAME
        value: "Kanhaiya General Store"
      - key: STORE_PHONE
        value: "9936269347"
      - key: STORE_WHATSAPP
        value: "9936269347"
      - key: STORE_UPI_ID
        value: "kanhaiyastore@upi"
